- insert:
    - id: restart-handoff
      name: 'dsh-restart-handoff'
      config:
        serviceUnit: 'dsh.service'
        autoResume: true
        resumeSubagents: true
        idleTimeoutMs: 30000
        # Recover the sessions an unplanned exit left behind.
        recoverInterruptedSessions: true
        recoverMaxAgeMs: 7200000
        recoverMaxSessions: 50
        # Wait for the Host's tool providers to settle before resuming, so a
        # resumed session is handed the same tools a fresh one would get.
        resumeSettleMs: 3000
